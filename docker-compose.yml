# docker-compose.yml

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: autobrain-postgres
    environment:
      POSTGRES_DB: autobrain
      POSTGRES_USER: autobrain
      POSTGRES_PASSWORD: autobrain_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autobrain"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: autobrain-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend (Pinecone, no Weaviate container)
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: autobrain-api
    working_dir: /app                  # <-- ensure imports like `apps.api.main` resolve
    environment:
      # DB/Cache
      DATABASE_URL: postgresql://autobrain:autobrain_dev_password@postgres:5432/autobrain
      REDIS_URL: redis://redis:6379/0

      # Pinecone (managed)
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_ENVIRONMENT: ${PINECONE_ENVIRONMENT:-us-east-1}
      PINECONE_INDEX: ${PINECONE_INDEX:-autobrain-dev}

      # LLMs
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}

      # App
      API_SECRET_KEY: dev_secret_key_change_in_production

      # Embeddings model (must match your Pinecone index dimension)
      # For text-embedding-3-large use 3072-dim in your code
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-large}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000   # <-- no --reload
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped           # <-- if it crashes, it restarts so you can see logs

  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: autobrain-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    # For development, mount the source
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:

networks:
  default:
    name: autobrain-network

